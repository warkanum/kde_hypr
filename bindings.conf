# type|...   (keys: Mod=Meta, ";" separates several)
#   bind  |component|action|keys[|set|add]   set = replace Meta keys (non-Meta kept), add = append
#   launch|id|Name|command|keys              custom command ($TERM_CMD $BROWSER_CMD $FILES_CMD $HERE expand)
#   keys may use $LEFT $DOWN $UP $RIGHT -> arrows or h/j/k/l per KEYSTYLE in config.env

# --- windows
bind|kwin|Window Maximize|Meta+F
bind|kwin|Window Fullscreen|Meta+Shift+F
bind|kwin|Window Close|Meta+Q
bind|kwin|Window Minimize|Meta+N
bind|kwin|Window Above Other Windows|Meta+V
bind|kwin|Switch Window Left|Meta+$LEFT
bind|kwin|Switch Window Down|Meta+$DOWN
bind|kwin|Switch Window Up|Meta+$UP
bind|kwin|Switch Window Right|Meta+$RIGHT
bind|kwin|Window Quick Tile Left|Meta+Shift+$LEFT
bind|kwin|Window Quick Tile Right|Meta+Shift+$RIGHT
bind|kwin|Window Quick Tile Top|Meta+Shift+$UP
bind|kwin|Window Quick Tile Bottom|Meta+Shift+$DOWN
bind|kwin|Window Quick Tile Top Left|Meta+Ctrl+Y
bind|kwin|Window Quick Tile Top Right|Meta+Ctrl+U
bind|kwin|Window Quick Tile Bottom Left|Meta+Ctrl+B
bind|kwin|Window Quick Tile Bottom Right|Meta+Ctrl+N
bind|kwin|Grid View|Meta+G
bind|kwin|Edit Tiles|Meta+T
bind|kwin|Window Pack Left|Meta+Alt+Left
bind|kwin|Window Pack Right|Meta+Alt+Right
bind|kwin|Window Pack Up|Meta+Alt+Up
bind|kwin|Window Pack Down|Meta+Alt+Down
bind|kwin|Window Move|Meta+Alt+M
bind|kwin|Window Resize|Meta+Alt+R

# --- desktops
bind|kwin|Switch to Desktop 1|Meta+1
bind|kwin|Switch to Desktop 2|Meta+2
bind|kwin|Switch to Desktop 3|Meta+3
bind|kwin|Switch to Desktop 4|Meta+4
bind|kwin|Switch to Desktop 5|Meta+5
bind|kwin|Switch to Desktop 6|Meta+6
bind|kwin|Switch to Desktop 7|Meta+7
bind|kwin|Switch to Desktop 8|Meta+8
bind|kwin|Switch to Desktop 9|Meta+9
bind|kwin|Window to Desktop 1|Meta+Shift+1
bind|kwin|Window to Desktop 2|Meta+Shift+2
bind|kwin|Window to Desktop 3|Meta+Shift+3
bind|kwin|Window to Desktop 4|Meta+Shift+4
bind|kwin|Window to Desktop 5|Meta+Shift+5
bind|kwin|Window to Desktop 6|Meta+Shift+6
bind|kwin|Window to Desktop 7|Meta+Shift+7
bind|kwin|Window to Desktop 8|Meta+Shift+8
bind|kwin|Window to Desktop 9|Meta+Shift+9
bind|kwin|HyperTogglePrevDesktop|Meta+Tab
bind|kwin|Switch to Previous Desktop|Meta+Shift+Tab
bind|kwin|Switch to Next Desktop|Meta+Alt+Tab
bind|kwin|Switch One Desktop to the Left|Meta+Ctrl+Left
bind|kwin|Switch One Desktop to the Right|Meta+Ctrl+Right
bind|kwin|Window One Desktop to the Left|Meta+Ctrl+Shift+Left
bind|kwin|Window One Desktop to the Right|Meta+Ctrl+Shift+Right

# --- screens
bind|kwin|Switch to Previous Screen|Meta+Comma
bind|kwin|Switch to Next Screen|Meta+Period
bind|kwin|Window to Previous Screen|Meta+Shift+Comma
bind|kwin|Window to Next Screen|Meta+Shift+Period

# --- launchers
launch|term|Hyper Terminal|$TERM_CMD|Meta+Return
launch|runner|Hyper KRunner|qdbus6 org.kde.krunner /App org.kde.krunner.App.toggleDisplay|Meta+D
launch|files|Hyper Files|$FILES_CMD|Meta+E
launch|browser|Hyper Browser|$BROWSER_CMD|Meta+B
launch|shot|Hyper Screenshot|spectacle -r|Meta+Shift+S
launch|scratch|Hyper Scratchpad|$HERE/scripts/scratchpad.sh|Meta+S
launch|reload|Hyper Reload|$HERE/active.sh --reload|Meta+Shift+R
bind|org.kde.plasma.emojier.desktop|_launch|Meta+Ctrl+E

# --- desktop / session
bind|kwin|Overview|Meta+W
bind|kwin|Show Desktop|Meta+Shift+D
bind|kwin|ExposeAll|Meta+Ctrl+Tab|add
bind|ksmserver|Lock Session|Meta+Alt+L|add
bind|ksmserver|Log Out|Meta+Shift+E|add
bind|plasmashell|show-on-mouse-pos|Meta+Shift+V

# --- audio / brightness / media (Mod+F-keys, hardware keys kept)
bind|kmix|mute|Meta+F1|add
bind|kmix|decrease_volume|Meta+F2|add
bind|kmix|increase_volume|Meta+F3|add
bind|kmix|mic_mute|Meta+F4|add
bind|mediacontrol|previousmedia|Meta+F7|add
bind|mediacontrol|playpausemedia|Meta+F8|add
bind|mediacontrol|nextmedia|Meta+F9|add
bind|org_kde_powerdevil|Decrease Screen Brightness|Meta+F10|add
bind|org_kde_powerdevil|Increase Screen Brightness|Meta+F11|add
